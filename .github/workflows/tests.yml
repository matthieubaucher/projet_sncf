name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Installer Python
        run: uv python install 3.11

      - name: Installer les dépendances
        run: uv sync

      - name: Exécuter les tests
        run: uv run pytest
