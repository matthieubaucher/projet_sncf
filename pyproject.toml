[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "projet_sncf"
version = "0.1.0"
description = "Projet commun sncf"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "plotly>=7.1.0",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "streamlit>=1.63.0",
]

[tool.setuptools.packages]
find = { where = ["src"] }

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.uv.workspace]
members = [
    "poc/analyse_matthieu",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.coverage.run]
source = ["src"]  # uniquement ce répertoire est verifier en couverture
branch = true
