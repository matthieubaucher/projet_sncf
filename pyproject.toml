[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "projet_sncf"
version = "0.1.0"
description = "Projet commun sncf"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "streamlit>=1.63.0",
]

[tool.setuptools.packages]
find = { where = ["src"] }

[tool.pytest.ini_options]
pythonpath = ["src", "src/projet_sncf/utils"]

[tool.uv.workspace]
members = [
    "poc/analyse_matthieu",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.coverage.run]
source = ["src"]  # uniquement ce répertoire est verifier en couverture
branch = true

[tool.ruff]
line-length = 79  # limite de PEP 8
src = ["src", "poc/analyse_amy"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N"]  # pycodestyle, pyflakes, imports, nommage

[tool.ruff.lint.pep8-naming]
# X_train, X_test : convention de scikit-learn pour une matrice de variables
extend-ignore-names = ["X", "X_*"]
